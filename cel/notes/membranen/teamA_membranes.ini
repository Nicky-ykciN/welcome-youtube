# Oercel - spontaneous membranes from a random soup (memA result, see runs/memA_src/TUNING.md)
#
# Mechanism (pair laws only, nothing placed): the nutrient N is a separate aqueous phase that does
# not mix with plain water (a_W_N 45 > 25). The random soup demixes into small N-rich droplets
# (an aqueous two-phase system / coacervate-like droplets). Lipid heads slightly prefer N
# (a_N_H 22 < 25), tails repel N strongly (a_N_T 65), so lipids adsorb on every droplet and wrap
# it in a bilayer: heads facing the N lumen inside and the water outside. The catalyst is
# water-shy like its substrate (a_K_W 45), so it partitions into the droplets before they close:
# every vesicle formed so far contains catalysts.
#
# Measured with exactly this physics (100k steps): L=100 seeds 1, 2, 5: 9, 8, 6 closed bilayer
# vesicles (tools/cells.py strict detector; peak 9 in each run), first ones at 22-30k steps;
# L=128 seed 6: 11 at 100k.
# 100% of them contain catalysts (8-70 each). Lumens: 60-460 N beads and 0-30 W beads each.
# Catalysts never crossed an intact bilayer in 7 dense-snapshot runs of 900 tau each; vesicle walls
# open transiently now and then and 2 single catalysts escaped that way in total. N exchange is
# slow (TUNING.md 2d, 2f, 2i, 2m).
#
# Chemistry is OFF here. Running this file as-is reproduces runs/memA_z25 bit for bit (9 vesicles,
# all with catalysts, at step 100000). With the SPEC example rates (p_syn_a 0.02) a vesicle eats its
# whole N lumen within ~1500 steps and collapses (TUNING.md 2h). Even at 1/100 of those rates (block
# at the bottom, TUNING.md 2k) the lumens run down within ~3000 tau, because N re-enters through the
# bilayer at only ~0.06 N/tau per vesicle (feed_cap 0.12). The life team must balance synthesis
# against that influx (p_syn of order 1e-5..1e-4) or change the nutrient supply.

L = 100
dt = 0.03
kT = 1
seed = 1
threads = 2
init = soup
steps = 100000
snap_every = 2000
stats_every = 500
ckpt_every = 25000
log_every = 10000
walltime = 0
warmup = 1000

# soup composition
f_lip = 0.20
f_Ka = 0.01
f_Kb = 0
c_N = 0.10

# lipid H-T-T-T
lip_nH = 1
lip_nT = 3
k_bond = 100
r0 = 0.5
k_angle = 15

# repulsion matrix (only the entries that differ from 25 are listed; all others are 25)
a_W_H = 20
a_W_T = 80
a_H_T = 50
a_W_N = 45
a_N_H = 22
a_N_T = 65
a_K_W = 45
a_K_H = 30
a_K_T = 120

# chemistry off while forming membranes
chem = 0
events = 0

