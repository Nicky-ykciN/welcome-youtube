# lifeB life.ini - membranes.ini physics (unchanged) + slow metabolism + steady convection cells.
# Laws only (SPEC section 0): pair forces, the H2T2 lipid template, local reactions, a uniform food
# supply, and a steady, structure-blind body force on EVERY bead that sets up 16 convection cells
# (stir_mode = cells: f = A (sin kx cos ky, -cos kx sin ky), k = 2 pi stir_n / L; like thermal
# convection cells in a pond). Needs the lifeB engine copy runs/lifeB_src/oercel (stir_mode is a
# lifeB addition). init = soup: a random well-mixed soup; vesicles form in the first ~10-50k steps.
#
# What it does (measured, runs/lifeB_src/TUNING.md): vesicles with catalysts take up N through the
# membrane (~0.02 N/tau each), make lipids (part of them end up in their own wall), grow slowly
# (official checklist 'groei' JA), and occasionally a large floppy vesicle is stretched at a
# hyperbolic point of the flow, necks and splits into two closed daughters with catalysts that are
# carried into different cells (C3a 170k, verified by eye; strain rate there ~12 A = 0.036).
# What it does NOT (yet) do: divisions are rare (~0-3 per 100k steps per L=100 box), often
# messy (daughters stay attached to bilayer-ribbon networks, or re-fuse), no daughter was seen to
# divide again, catalyst-free vesicles can still gain lipid by absorbing ribbons, and the
# official tracker (tools/tracking.py) does not register the clean ones (detection gaps at the neck).
#
# Reproduction: `runs/lifeB_src/oercel runs/lifeB_src/params/life.ini runs/<name>` (chunks: add
# walltime=515 under `timeout 540`, then restart=runs/<name>/ckpt.bin). Run as-is it is bitwise
# identical to runs/lifeB_V1_flip15 (checked over 3000 steps; any thread count), which shows the
# cleanest division found: step 207k-221.5k, 123 K -> two closed daughters with ~68 and ~56 K
# (figs in runs/lifeB_V1_flip15/figs). f_lip 0.15 (instead of membranes.ini's 0.20) leaves fewer
# loose bilayer ribbons; the 0.20 variant is params/life_fl20.ini (runs lifeB_PROD1/PROD2).
L = 100
dt = 0.03
kT = 1
gamma = 4.5
seed = 3
threads = 2
init = soup
steps = 700000
snap_every = 500
stats_every = 500
ckpt_every = 10000
log_every = 10000
warmup = 3000

# soup composition
f_lip = 0.15
f_Ka = 0.01
f_Kb = 0
c_N = 0.10

# lipid: tied double-tailed H2T2 "pi" lipid
lip_arch = pi
lip_nT = 1
lip_tie = 1
r0_head = 0.7
k_head = 0
k_bond = 300
r0 = 0.5
k_angle = 15
syn_nN = 0

# repulsion matrix (entries not listed are 25; a_X_K sets Ka and Kb alike)
a_W_H = 20
a_W_T = 200
a_H_T = 50
a_W_N = 45
a_H_N = 22
a_T_N = 120
a_W_K = 45
a_H_K = 30
a_T_K = 200

# chemistry (on from the start; slow compared with membrane formation)
chem = 1
events = 1


# metabolism (per chemistry check, n_chem = 10 steps)
p_syn_a = 1e-4
p_syn_b = 3e-4
p_rep_a = 3e-5
p_rep_b = 3e-5
mu = 0.02
p_ld = 2e-5
p_kd = 1e-5
p_nd = 0
feed = uniform
p_feed = 1e-4
feed_cap = 0.12

# environment: steady convection cells (every bead, structure blind)
stir_mode = cells
stir_n = 2
stir_A = 3e-3
