# lifeB life.ini (DRAFT, 07:00): membranes.ini physics unchanged + metabolism + convection-cell stirring.
# Laws only (SPEC section 0): pair forces, lipid template, local reactions, uniform food supply,
# and a steady body force on every bead forming 16 convection cells (stir_mode = cells, needs the
# lifeB engine copy runs/lifeB_src/oercel). init = soup: a random well-mixed soup.
# See runs/lifeB_src/TUNING.md for the measurements behind every number.
L = 100
dt = 0.03
kT = 1
gamma = 4.5
seed = 1
threads = 2
init = soup
steps = 1000000
snap_every = 500
stats_every = 500
ckpt_every = 10000
log_every = 10000
warmup = 3000

# soup composition
f_lip = 0.20
f_Ka = 0.01
f_Kb = 0
c_N = 0.10

# lipid: tied double-tailed H2T2 "pi" lipid
lip_arch = pi
lip_nT = 1
lip_tie = 1
r0_head = 0.7
k_head = 0
k_bond = 300
r0 = 0.5
k_angle = 15
syn_nN = 0

# repulsion matrix (entries not listed are 25; a_X_K sets Ka and Kb alike)
a_W_H = 20
a_W_T = 200
a_H_T = 50
a_W_N = 45
a_H_N = 22
a_T_N = 120
a_W_K = 45
a_H_K = 30
a_T_K = 200

# chemistry (on from the start; slow compared with membrane formation)
chem = 1
events = 1


# metabolism (per chemistry check, n_chem = 10 steps)
p_syn_a = 1e-4
p_syn_b = 3e-4
p_rep_a = 3e-5
p_rep_b = 3e-5
mu = 0.02
p_ld = 2e-5
p_kd = 1e-5
p_nd = 0
feed = uniform
p_feed = 1e-4
feed_cap = 0.12

# environment: steady convection cells (every bead, structure blind)
stir_mode = cells
stir_n = 2
stir_A = 2.5e-3
