# lifeB KC base: catalyst-condensate lumen (K droplets wrapped by the membranes.ini lipid),
# nutrient N fully miscible with water and water-like towards lipids. Formation from a random soup:
# runs/lifeB_KC6_Nwater_cN02 (this file with chem=0, steps 100000). Chemistry on for life branches.
L = 100
dt = 0.03
kT = 1
gamma = 4.5
seed = 1
threads = 2
init = soup
steps = 100000
snap_every = 2000
stats_every = 500
ckpt_every = 25000
log_every = 10000
warmup = 3000

# soup composition
f_lip = 0.20
f_Ka = 0.08
f_Kb = 0
c_N = 0.02

# lipid: tied double-tailed H2T2 "pi" lipid
lip_arch = pi
lip_nT = 1
lip_tie = 1
r0_head = 0.7
k_head = 0
k_bond = 300
r0 = 0.5
k_angle = 15
syn_nN = 0

# repulsion matrix (entries not listed are 25; a_X_K sets Ka and Kb alike)
a_W_H = 20
a_W_T = 200
a_H_T = 50
a_W_N = 25
a_H_N = 20
a_T_N = 200
a_W_K = 45
a_H_K = 22
a_T_K = 120
a_N_K = 22

# chemistry
chem = 1
events = 1

p_syn_a = 3e-3
p_syn_b = 9e-3
p_rep_a = 2e-4
p_rep_b = 2e-4
mu = 0.02
p_ld = 1e-5
p_kd = 2e-5
p_nd = 0
feed = uniform
p_feed = 5e-5
feed_cap = 0.04
