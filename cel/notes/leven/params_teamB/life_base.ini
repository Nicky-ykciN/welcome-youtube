# lifeB base: membranes.ini physics (judge's final membrane laws) + chemistry ON.
# Used as the INI for branches of runs/membranes_final/ckpt.bin (step 100000, random soup seed 1).
# Per-run overrides are given on the command line (recorded in each run's params.ini).
L = 100
dt = 0.03
kT = 1
gamma = 4.5
seed = 1
threads = 2
init = soup
steps = 100000
snap_every = 2000
stats_every = 500
ckpt_every = 25000
log_every = 10000
warmup = 3000

# soup composition
f_lip = 0.20
f_Ka = 0.01
f_Kb = 0
c_N = 0.10

# lipid: tied double-tailed H2T2 "pi" lipid
lip_arch = pi
lip_nT = 1
lip_tie = 1
r0_head = 0.7
k_head = 0
k_bond = 300
r0 = 0.5
k_angle = 15
syn_nN = 0

# repulsion matrix (entries not listed are 25; a_X_K sets Ka and Kb alike)
a_W_H = 20
a_W_T = 200
a_H_T = 50
a_W_N = 45
a_H_N = 22
a_T_N = 120
a_W_K = 45
a_H_K = 30
a_T_K = 200

# chemistry
chem = 1
events = 1

p_syn_a = 2e-4
p_syn_b = 6e-4
p_rep_a = 1e-4
p_rep_b = 1e-4
mu = 0.02
p_ld = 2e-6
p_kd = 5e-6
p_nd = 1e-6
feed = uniform
p_feed = 1e-4
feed_cap = 0.11
