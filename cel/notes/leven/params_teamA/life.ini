# Oercel - life stage, team lifeA (internal route: no stirring, no temperature cycle).
# DRAFT (session 1, 09:40) - see TUNING.md. Physics = params/membranes.ini (tied pi1 lipid, two-phase
# nutrient) with ONE law changed: r0_tie = 0.8 (tie bond between the two tail beads slightly longer
# than the head-head bond 0.7: a mildly inverted-cone lipid; needs this engine copy, runs/lifeA_src).
# Chemistry on from the start. Only laws and a structure-blind uniform food supply (SPEC section 0).
#
# Usage:  oercel params/life.ini OUTDIR                                  (random soup, seed 1)
#    or:  oercel params/life.ini OUTDIR restart=runs/membranes_final/ckpt.bin warmup=0
#         (continue the vesicle-rich soup checkpoint with these laws; allowed by SPEC section 4)

