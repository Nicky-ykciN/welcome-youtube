# Oercel example: small primordial soup (tuning box).  L = 64 -> N = 12288 beads.
# Random lipids (H-T-T-T), a few Ka catalysts, nutrients at c_N; Kb arises only by mutation.
# The chemistry rates are STARTING VALUES, chosen so that nothing runs away:
#   catalysts are roughly stationary in the bulk (replication ~ decay at c_N),
#   lipids turn over (synthesis vs decay p_ld).  Tune for protocell experiments.
# Run:  engine/oercel engine/params/soup_small.ini runs/<name>
L = 64
dt = 0.03
seed = 2026
threads = 2
init = soup
steps = 300000
snap_every = 5000
stats_every = 100
ckpt_every = 10000
log_every = 10000
walltime = 0
warmup = 1000

# composition
f_lip = 0.10
f_Ka = 0.005
f_Kb = 0
c_N = 0.12

# chemistry (probabilities per check, one check every n_chem steps)
chem = 1
n_chem = 10
r_cat = 1.2
p_syn_a = 0.02
p_syn_b = 0.06
p_rep_a = 1e-3
p_rep_b = 1e-3
mu = 0.02
p_ld = 2e-4
p_kd = 5e-4
p_nd = 1e-4
syn_tries = 8
syn_relax = 20
feed = 1
feed_every = 10
feed_grid = 1.6
feed_tmin = 1

# repulsion matrix: entries that differ from 25 (all others are 25)
a_W_H = 20
a_W_T = 80
a_H_T = 50
a_N_T = 40
a_K_H = 30
a_K_T = 120
