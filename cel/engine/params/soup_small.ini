# Oercel: small primordial soup (tuning box).  L = 64 -> N = 12288 beads.
# Random lipids (H-T-T-T), a few Ka catalysts, nutrients at c_N; Kb arises only by mutation.
L = 64
dt = 0.03
seed = 2026
threads = 2
init = soup
steps = 200000
snap_every = 2000
stats_every = 100
ckpt_every = 10000
log_every = 5000
walltime = 0

# composition
f_lip = 0.10
f_Ka = 0.005
f_Kb = 0
c_N = 0.12

# chemistry (probabilities per check, a check every n_chem steps)
chem = 1
n_chem = 10
r_cat = 1.2
p_syn_a = 0.02
p_syn_b = 0.06
p_rep_a = 0.001
p_rep_b = 0.003
mu = 0.02
p_ld = 1e-6
p_kd = 1e-5
p_nd = 1e-5
feed = 1
feed_grid = 1.6
feed_tmin = 1

# repulsion matrix (only entries that differ from like-like 25 are listed)
a_W_H = 20
a_W_T = 80
a_H_T = 50
a_N_T = 40
a_K_H = 30
a_K_T = 120
