# Oercel - spontaneous membranes from a random soup (final, chosen by the judge; see
# notes/membranen/judge_NOTES.md for the comparison and engine/README.md "Membrane physics").
# Origin: team memB (lipid architecture, notes/membranen/teamB_TUNING.md) on top of team memA's
# two-phase nutrient physics (notes/membranen/teamA_TUNING.md). Runs on the main engine (engine/oercel).
# (Paths relative to cel/. runs/... = run output on the development machine, not in git.)
#
# Only laws of nature, nothing placed (SPEC section 0). init = soup: a random, well-mixed soup.
#
# Lipid: a tied double-tailed "pi" lipid H2T2 (4 beads): two bonded heads H1-H2 (rest 0.7), one
# tail bead on each head (rest r0 = 0.5) and a tie bond between the two tail beads (rest 0.7):
# a small rectangle with 4 bonds and no angle terms (k_angle has no effect on it). Tied tails cannot
# splay, so bilayers form no Y/T junctions. Lipid synthesis (SPEC 3.1) builds exactly this molecule
# from 4 N (syn_nN = 0). k_bond = 300 because new lipids appear inside the N/catalyst lumen, which
# repels tails: with k_bond 100 their bonds stretched to 1.5-2.1 (memB); with 300 the longest bond
# stays < 1.45. T_kin is then ~0.985 (-1.5 %, within the +-3 % limit).
#
# Mechanism (emergent): the nutrient N does not mix with plain water (a_W_N 45): the soup demixes
# into small N-rich droplets (an aqueous two-phase system, coacervate-like). Heads slightly prefer N
# (a_H_N 22), tails repel water and N strongly (a_W_T 200, a_T_N 120): lipids wrap every droplet in
# a closed bilayer, heads facing the N lumen inside and the water outside. The catalyst is as
# water-shy as its substrate (a_W_K 45, sets Ka and Kb) and sits in the droplets before they close.
#
# Measured with exactly this physics (chemistry off, L = 100, 100k steps, tools/cells.detect cells,
# mean over the 2nd half of the run):
#   seeds 1, 2, 3 (memB): 13.4, 13.6, 11.7 cells; seeds 7, 8 (judge re-runs): 9.7, 11.3
#   (max 15-17); first >= 3 closed vesicles after 10-15k steps; 95-100 % contain catalysts
#   (median 10-13 per vesicle); median lumen area 26-39. L = 128 (memB): 20 cells.
#   By the same measure memA's linear H-T-T-T physics gave 4.3 and 6.6 (seeds 7, 8).
#   Running this file as-is is bitwise identical to runs/memB_F01_wt200_kb300 (100k: 14 cells) with
#   the same build; a build with another force kernel (e.g. no AVX-512) gives a different trajectory.
# Catalysts never crossed an intact bilayer (3 x 900 tau of snapshots every 100 steps, memB + judge);
# the few that left went through open wall gaps. N permeates slowly in both directions.
# Known limits: the lumen IS the N phase (mostly N, little W), so synthesis eats it (with p_syn_a
# 2e-3 all vesicles were gone within 10k steps, with 2e-4 about half within 30k); loose bilayer
# ribbons (excess lipid) coexist with the vesicles; without chemistry the vesicles coarsen slowly
# (~11 -> ~8.5 between 100k and 200k steps).

L = 100
dt = 0.03
kT = 1
gamma = 4.5
seed = 1
threads = 2
init = soup
steps = 100000
snap_every = 2000
stats_every = 500
ckpt_every = 25000
log_every = 10000
warmup = 3000

# soup composition
f_lip = 0.20
f_Ka = 0.01
f_Kb = 0
c_N = 0.10

# lipid: tied double-tailed H2T2 "pi" lipid
lip_arch = pi
lip_nT = 1
lip_tie = 1
r0_head = 0.7
k_head = 0
k_bond = 300
r0 = 0.5
k_angle = 15
syn_nN = 0

# repulsion matrix (entries not listed are 25; a_X_K sets Ka and Kb alike)
a_W_H = 20
a_W_T = 200
a_H_T = 50
a_W_N = 45
a_H_N = 22
a_T_N = 120
a_W_K = 45
a_H_K = 30
a_T_K = 200

# chemistry off while forming membranes
chem = 0
events = 0

# --- for later (life team), NOT tuned: slow chemistry used only for the synthesis/bond checks ---
# (with p_syn_a 2e-3 the N lumens are eaten within ~10k steps; 2e-4 halves the vesicles in 30k)
