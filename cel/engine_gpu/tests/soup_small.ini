# Oercel example: small primordial soup (tuning box).  L = 64 -> N = 12288 beads.
# Random lipids (H-T-T-T), a few Ka catalysts, nutrients at c_N; Kb arises only by mutation.
# Only laws of nature (SPEC section 0): nothing is placed, the start is a random well-mixed soup.
# The chemistry rates are STARTING VALUES (not tuned for protocells).
# Run:  engine/oercel engine/params/soup_small.ini runs/<name>
L = 64
dt = 0.03
seed = 2026
threads = 2
init = soup
steps = 300000
snap_every = 5000
stats_every = 100
ckpt_every = 10000
log_every = 10000
walltime = 0
warmup = 1000

# composition of the random soup
f_lip = 0.10
f_Ka = 0.005
f_Kb = 0
c_N = 0.12

# chemistry (probabilities per check, one check every n_chem steps)
chem = 1
n_chem = 10
r_cat = 1.2
p_syn_a = 0.02
p_syn_b = 0.06
p_rep_a = 1e-3
p_rep_b = 1e-3
mu = 0.02
p_ld = 2e-4
p_kd = 5e-4
p_nd = 1e-4
syn_tries = 8
syn_relax = 20

# food supply, structure blind (SPEC 3.4): every W anywhere becomes N with probability
# p_feed per check, but never above the global nutrient fraction feed_cap.
feed = uniform
p_feed = 1e-3
feed_cap = 0.12
# alternative: a fixed source region (vent) at fixed coordinates, e.g.
#   feed = vent
#   vent_shape = disk        # disk | vstrip | hstrip
#   vent_x = 32
#   vent_y = 32
#   vent_r = 6               # disk radius (vent_w = strip width)
#   p_feed = 0.02

# environment, uniform for every bead (off here):
#   stir_A = 2e-4            # Kolmogorov stirring f_x = stir_A sin(2 pi stir_n y / L)
#   stir_n = 1
#   kT_amp = 0.1             # temperature cycle kT(t) = kT + kT_amp sin(2 pi t / kT_period)
#   kT_period = 3000

# repulsion matrix: entries that differ from 25 (all others are 25)
a_W_H = 20
a_W_T = 80
a_H_T = 50
a_N_T = 40
a_K_H = 30
a_K_T = 120
